<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>飛び出す写真ルーム（高画質・切り抜き対応）</title>
<style>
  body{margin:0;font-family:sans-serif;background:#111;color:#eee}
  #ui{position:fixed;top:0;left:0;right:0;padding:12px 16px;background:#000c;z-index:10;max-height:62vh;overflow:auto;box-sizing:border-box}
  #status{margin-top:8px;font-size:14px}
  label{font-size:14px;margin-right:12px}
  .bar{margin-top:8px;font-size:13px}
  .track{height:14px;background:#333;border-radius:7px;overflow:hidden;margin-top:4px}
  .fill{height:100%;width:0%;background:linear-gradient(90deg,#0cf,#6f6);transition:width .2s}
  .hidden{display:none}
  #tune{display:grid;grid-template-columns:max-content 1fr 4.5em;gap:4px 10px;align-items:center;margin-top:8px;font-size:14px}
  #tune input[type=range]{width:100%}
  #tune .v{font-variant-numeric:tabular-nums;color:#9cf}
  details{margin-top:8px}
  summary{cursor:pointer;font-size:14px;color:#9cf}
  .help{font-size:12px;color:#aaa;line-height:1.6;margin-top:6px}
  select,button{font-size:14px}
</style>
<script>
  // ===== エラーを画面下に赤く表示 =====
  window.appStarted = false;
  function showErr(msg){
    let box = document.getElementById('errBox');
    if (!box){
      box = document.createElement('div');
      box.id = 'errBox';
      box.style.cssText = 'position:fixed;bottom:0;left:0;right:0;max-height:40%;overflow:auto;' +
        'background:#a00;color:#fff;font:13px monospace;padding:10px;z-index:9999;white-space:pre-wrap';
      document.body.appendChild(box);
    }
    box.textContent += '⚠ ' + msg + '\n';
  }
  window.addEventListener('error', e => {
    const where = e.filename ? `（${e.filename.split('/').pop()} ${e.lineno}行目）` : '';
    showErr((e.message || '部品の読み込みに失敗しました') + where);
  }, true);
  window.addEventListener('unhandledrejection', e => {
    showErr(e.reason && (e.reason.stack || e.reason.message) || String(e.reason));
  });
  window.addEventListener('load', () => {
    setTimeout(() => {
      if (!window.appStarted){
        showErr('プログラムが起動していません（部品の読み込みに失敗したか、このブラウザが未対応の可能性）');
      }
    }, 10000);
  });
</script>
</head>
<body>
<div id="ui">
  <input type="file" id="files" accept="image/*" multiple>
  <div style="margin-top:8px">
    <label>切り抜きAI
      <select id="cutModel">
        <option value="birefnet">高精度（BiRefNet）</option>
        <option value="modnet">軽量（MODNet）</option>
      </select>
    </label>
    <label><input type="checkbox" id="cutDefault" checked> 人物を切り抜く（最初の状態）</label>
    <button id="cutAllOn">全部 切り抜きON</button>
    <button id="cutAllOff">全部 切り抜きOFF</button>
  </div>
  <details>
    <summary>見え方の調整（VRの中でもスティック押し込みで出せます）</summary>
    <div id="tune"></div>
    <button id="resetTune" style="margin-top:6px">初期値に戻す</button>
  </details>
  <div class="help">
    片手トリガー：つかんで移動 ／ 両手トリガー：広げて拡大縮小 ／ つかんでスティック上下：微調整<br>
    つかんで A・X：その写真の切り抜き切替 ／ B・Y：全部の切り抜き切替<br>
    <b>スティック押し込み：調整パネル ／ つかんだままスティック押し込み：その写真を削除</b>
  </div>
  <div id="status">読み込み中…</div>

  <div id="dlBox" class="bar hidden">
    <span id="dlText">AIをダウンロード中… 0%</span>
    <div class="track"><div id="dlFill" class="fill"></div></div>
  </div>
  <div id="allBox" class="bar hidden">
    <span id="allText">全体 0 / 0 枚</span>
    <div class="track"><div id="allFill" class="fill"></div></div>
  </div>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.164.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.164.0/examples/jsm/"
}}
</script>

<script type="module">
import * as THREE from 'three';
import { ARButton } from 'three/addons/webxr/ARButton.js';
import { pipeline, AutoModel, AutoProcessor, RawImage } from 'https://cdn.jsdelivr.net/npm/@huggingface/transformers@3';

window.appStarted = true;
const $ = id => document.getElementById(id);
const status = $('status');
status.textContent = '写真を選んでください（何枚でもOK）。準備ができたら下の「START AR」を押します。';

// =====================================================================
// 調整できる項目（スマホの画面とVRのパネルの両方に出ます）
// =====================================================================
const PARAMS = [
  { key:'depth',    label:'飛び出し量',       min:0,    max:0.8,  step:0.02, def:0.25, geo:true,
    fmt:v => v.toFixed(2) },
  { key:'relief',   label:'凹凸の強さ',       min:0,    max:1.5,  step:0.05, def:0.5,  geo:true,
    fmt:v => Math.round(v*100) + '%' },
  { key:'smooth',   label:'なめらかさ',       min:0,    max:12,   step:1,    def:3,    geo:true,
    fmt:v => String(v) },
  { key:'thresh',   label:'切り抜きのしきい値', min:0.05, max:0.95, step:0.05, def:0.5,
    fmt:v => v.toFixed(2) },
  { key:'depthCut', label:'人物の後ろを削る',  min:0,    max:1,    step:0.05, def:0,
    fmt:v => v <= 0 ? 'なし' : Math.round(v*100) + '%' },
  { key:'fade',     label:'斜めで薄く消す',    min:20,   max:90,   step:5,    def:60,
    fmt:v => v >= 90 ? 'なし' : v + '°〜' },
  { key:'back',     label:'裏側',            options:['hide','shadow','show'], def:'shadow',
    names:{ hide:'非表示', shadow:'影', show:'表示' } },
];
const STORE_KEY = 'popPhotoSettings.v2';
const settings = {};
for (const p of PARAMS) settings[p.key] = p.def;
let savedCutModel = null;
try {
  const s = JSON.parse(localStorage.getItem(STORE_KEY) || '{}');
  for (const p of PARAMS) if (s[p.key] !== undefined) settings[p.key] = s[p.key];
  savedCutModel = s.cutModel || null;
} catch (e) {}
if (savedCutModel) $('cutModel').value = savedCutModel;
function saveSettings(){
  try { localStorage.setItem(STORE_KEY, JSON.stringify({ ...settings, cutModel: $('cutModel').value })); } catch (e) {}
}
$('cutModel').addEventListener('change', saveSettings);

const roundStep = (p, v) => {
  v = Math.min(p.max, Math.max(p.min, v));
  const dec = (String(p.step).split('.')[1] || '').length;
  return parseFloat((Math.round((v - p.min) / p.step) * p.step + p.min).toFixed(dec));
};
const paramValueText = p => p.options ? p.names[settings[p.key]] : p.fmt(settings[p.key]);

// スマホ画面のスライダーを作る
const tuneInputs = {};
for (const p of PARAMS){
  const lab = document.createElement('span'); lab.textContent = p.label;
  let input;
  if (p.options){
    input = document.createElement('select');
    for (const o of p.options){
      const op = document.createElement('option'); op.value = o; op.textContent = p.names[o]; input.appendChild(op);
    }
    input.addEventListener('change', () => setParam(p.key, input.value));
  } else {
    input = document.createElement('input');
    Object.assign(input, { type:'range', min:p.min, max:p.max, step:p.step });
    input.addEventListener('input', () => setParam(p.key, parseFloat(input.value)));
  }
  const val = document.createElement('span'); val.className = 'v';
  $('tune').append(lab, input, val);
  tuneInputs[p.key] = { input, val };
}
function syncHtml(){
  for (const p of PARAMS){
    const t = tuneInputs[p.key];
    t.input.value = settings[p.key];
    t.val.textContent = paramValueText(p);
  }
}
$('resetTune').onclick = () => resetParams();

let geoDirty = false;
function setParam(key, value){
  const p = PARAMS.find(q => q.key === key);
  settings[key] = p.options ? value : roundStep(p, value);
  saveSettings();
  syncHtml();
  drawPanel();
  if (p.geo) geoDirty = true;
  applyLook();
}
function resetParams(){
  for (const p of PARAMS) settings[p.key] = p.def;
  saveSettings(); syncHtml(); drawPanel();
  geoDirty = true; applyLook();
}

// ===== プログレスバー =====
function setBar(box, fill, text, ratio, label){
  $(box).classList.remove('hidden');
  $(fill).style.width = (Math.max(0, Math.min(1, ratio)) * 100).toFixed(1) + '%';
  $(text).textContent = label;
}
const dlFiles = {};
function onDownloadProgress(p){
  if (p.status === 'progress' && p.total){
    dlFiles[p.name + '/' + p.file] = { loaded:p.loaded, total:p.total };
    let loaded = 0, total = 0;
    for (const f of Object.values(dlFiles)){ loaded += f.loaded; total += f.total; }
    const mb = x => (x/1048576).toFixed(1);
    setBar('dlBox','dlFill','dlText', loaded/total,
      `AIをダウンロード中… ${Math.round(loaded/total*100)}%（${mb(loaded)} / ${mb(total)} MB）`);
  }
}

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(70, innerWidth/innerHeight, 0.01, 50);

// ===== 高画質設定 =====
const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.xr.enabled = true;
renderer.xr.setFramebufferScaleFactor(1.5);
renderer.xr.setFoveation(0);
document.body.appendChild(renderer.domElement);
document.body.appendChild(ARButton.createButton(renderer, { optionalFeatures:['local-floor'] }));

const MAX_TEX = Math.min(renderer.capabilities.maxTextureSize, 4096);
const MAX_MASK = 2048;   // 切り抜きマスクの最大解像度
const GRID = 512;        // 奥行き計算用の解像度（長辺）
const ANISO = renderer.capabilities.getMaxAnisotropy();

const photos = [];

// =====================================================================
// AIモデル
// =====================================================================
let depthModel = null;
async function loadDepthModel(){
  if (depthModel) return;
  status.textContent = '奥行きAIを準備中…（初回だけダウンロードがあります）';
  depthModel = await pipeline('depth-estimation', 'onnx-community/depth-anything-v2-small',
    { progress_callback: onDownloadProgress });
}

const BIREF_ID = 'onnx-community/BiRefNet_lite-ONNX';
const cutModels = {};
let forceWasm = false;

async function pickDevice(){
  if (forceWasm || !navigator.gpu) return { device:'wasm', dtype:'fp32' };
  try {
    const ad = await navigator.gpu.requestAdapter();
    if (!ad) return { device:'wasm', dtype:'fp32' };
    return { device:'webgpu', dtype: ad.features.has('shader-f16') ? 'fp16' : 'fp32' };
  } catch (e) {
    return { device:'wasm', dtype:'fp32' };
  }
}

async function loadCutModel(kind){
  if (cutModels[kind]) return cutModels[kind];
  if (kind === 'modnet'){
    status.textContent = '切り抜きAI（軽量）を準備中…';
    const pipe = await pipeline('background-removal', 'Xenova/modnet', { progress_callback: onDownloadProgress });
    cutModels.modnet = {
      name: '軽量（MODNet）',
      run: async (file, url) => { const r = await pipe(url); return Array.isArray(r) ? r[0] : r; }
    };
    return cutModels.modnet;
  }
  // 高精度：BiRefNet lite（GPUが使えればGPU、だめならCPU）
  const first = await pickDevice();
  const tries = [first];
  if (first.device !== 'wasm') tries.push({ device:'wasm', dtype:'fp32' });
  let lastErr;
  for (const t of tries){
    try {
      status.textContent = `切り抜きAI（高精度・${t.device === 'webgpu' ? 'GPU' : 'CPU'}）を準備中…初回は100〜230MBのダウンロードがあります`;
      const model = await AutoModel.from_pretrained(BIREF_ID,
        { device:t.device, dtype:t.dtype, progress_callback: onDownloadProgress });
      const proc = await AutoProcessor.from_pretrained(BIREF_ID, { progress_callback: onDownloadProgress });
      cutModels.birefnet = {
        name: `高精度（BiRefNet・${t.device === 'webgpu' ? 'GPU' : 'CPU'}）`,
        device: t.device,
        run: async (file) => {
          const image = await RawImage.fromBlob(file);
          const { pixel_values } = await proc(image);
          const out = await model({ input_image: pixel_values });
          const ten = out.output_image ?? Object.values(out)[0];
          return RawImage.fromTensor(ten[0].sigmoid().mul(255).to('uint8'));
        }
      };
      return cutModels.birefnet;
    } catch (e) {
      lastErr = e;
      if (t.device === 'webgpu') forceWasm = true;
    }
  }
  throw lastErr;
}

async function runCutout(file, url){
  const kind = $('cutModel').value;
  try {
    const m = await loadCutModel(kind);
    status.textContent += `（切り抜き：${m.name}）`;
    return await m.run(file, url);
  } catch (e) {
    if (kind !== 'birefnet') throw e;
    const msg = e && e.message ? e.message : String(e);
    // GPUで動かなかったらCPUで1回だけやり直す
    if (cutModels.birefnet && cutModels.birefnet.device === 'webgpu'){
      delete cutModels.birefnet; forceWasm = true;
      try { const m = await loadCutModel('birefnet'); return await m.run(file, url); } catch (e2) {}
    }
    showErr('高精度の切り抜きが使えなかったので、軽量版に切り替えます：' + msg);
    delete cutModels.birefnet;
    $('cutModel').value = 'modnet'; saveSettings();
    const m = await loadCutModel('modnet');
    return await m.run(file, url);
  }
}

// =====================================================================
// 画像まわりの道具
// =====================================================================
function loadImage(url){
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = () => reject(new Error('画像を読み込めませんでした（形式が未対応の可能性）'));
    img.src = url;
  });
}

function toTexture(canvas, color = true){
  const tex = new THREE.CanvasTexture(canvas);
  if (color) tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = ANISO;
  tex.minFilter = THREE.LinearMipmapLinearFilter;
  tex.magFilter = THREE.LinearFilter;
  tex.generateMipmaps = true;
  return tex;
}

function fitSize(w, h, max){
  const k = Math.min(1, max / Math.max(w, h));
  return [Math.max(1, Math.round(w*k)), Math.max(1, Math.round(h*k))];
}

function drawPhoto(img){
  const [w, h] = fitSize(img.width, img.height, MAX_TEX);
  const cv = document.createElement('canvas');
  cv.width = w; cv.height = h;
  const ctx = cv.getContext('2d');
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(img, 0, 0, w, h);
  return cv;
}

// RawImage の1ピクセルの値（RGBAなら透明度、それ以外は1チャンネル目）
const rawVal = (raw, i) => raw.channels === 4 ? raw.data[i*4+3] : raw.data[i*raw.channels];

// RawImage → 白黒の canvas（マスク用）
function rawToCanvas(raw, w, h){
  const src = document.createElement('canvas');
  src.width = raw.width; src.height = raw.height;
  const sctx = src.getContext('2d');
  const id = sctx.createImageData(raw.width, raw.height);
  for (let i = 0; i < raw.width*raw.height; i++){
    const v = rawVal(raw, i);
    id.data[i*4] = id.data[i*4+1] = id.data[i*4+2] = v; id.data[i*4+3] = 255;
  }
  sctx.putImageData(id, 0, 0);
  const cv = document.createElement('canvas');
  cv.width = w; cv.height = h;
  const ctx = cv.getContext('2d');
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(src, 0, 0, w, h);
  return cv;
}

// canvas → 0〜1 の数値の配列（赤チャンネル）
function canvasToGrid(canvas, w, h){
  const cv = document.createElement('canvas');
  cv.width = w; cv.height = h;
  const ctx = cv.getContext('2d');
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(canvas, 0, 0, w, h);
  const d = ctx.getImageData(0, 0, w, h).data;
  const g = new Float32Array(w*h);
  for (let i = 0; i < w*h; i++) g[i] = d[i*4] / 255;
  return g;
}

function boxBlur(src, w, h, r){
  if (r <= 0) return src.slice();
  const tmp = new Float32Array(w*h), out = new Float32Array(w*h), n = 2*r + 1;
  for (let y = 0; y < h; y++){
    const row = y*w; let s = 0;
    for (let k = -r; k <= r; k++) s += src[row + Math.min(w-1, Math.max(0, k))];
    for (let x = 0; x < w; x++){
      tmp[row+x] = s / n;
      s += src[row + Math.min(w-1, x+r+1)] - src[row + Math.max(0, x-r)];
    }
  }
  for (let x = 0; x < w; x++){
    let s = 0;
    for (let k = -r; k <= r; k++) s += tmp[Math.min(h-1, Math.max(0, k))*w + x];
    for (let y = 0; y < h; y++){
      out[y*w+x] = s / n;
      s += tmp[Math.min(h-1, y+r+1)*w + x] - tmp[Math.max(0, y-r)*w + x];
    }
  }
  return out;
}
const blur2 = (a, w, h, r) => boxBlur(boxBlur(a, w, h, r), w, h, r);

// 人物の中だけでなめらかにする（背景の奥行きが顔のふちに混ざらないように）
function smoothDepth(G, M, w, h, r){
  if (r <= 0) return G.slice();
  const W = new Float32Array(w*h), GW = new Float32Array(w*h);
  for (let i = 0; i < w*h; i++){ W[i] = M[i] > 0.5 ? 1 : 0; GW[i] = G[i] * W[i]; }
  const A = blur2(GW, w, h, r), B = blur2(W, w, h, r), all = blur2(G, w, h, r);
  const P = new Float32Array(w*h);
  for (let i = 0; i < w*h; i++) P[i] = (W[i] > 0 && B[i] > 1e-3) ? A[i] / B[i] : all[i];
  return P;
}

function medianMasked(G, M){
  const vals = [];
  for (let i = 0; i < G.length; i++) if (M[i] > 0.5) vals.push(G[i]);
  const arr = vals.length > 50 ? vals : Array.from(G);
  arr.sort((a, b) => a - b);
  return arr[Math.floor(arr.length / 2)] || 0.5;
}

// =====================================================================
// 写真の見た目（シェーダー）
// =====================================================================
const VERT = `
varying vec2 vUv;
void main(){
  vUv = uv;
  gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
}`;
const FRAG = `
uniform sampler2D map;
uniform sampler2D maskMap;
uniform sampler2D depthMap;
uniform float uCut, uThresh, uDepthCut, uRef, uOpacity, uShadow;
varying vec2 vUv;
void main(){
  if (uOpacity < 0.01) discard;
  vec4 c = texture2D(map, vUv);
  if (uCut > 0.5){
    float a = texture2D(maskMap, vUv).r;
    if (a < uThresh) discard;
    if (uDepthCut > 0.001){
      float d = texture2D(depthMap, vUv).r;
      if (d < uDepthCut * uRef) discard;
    }
  }
  vec3 col = uShadow > 0.5 ? vec3(0.0) : c.rgb;
  float alpha = (uShadow > 0.5 ? 0.55 : 1.0) * uOpacity;
  gl_FragColor = vec4(col, alpha);
  #include <colorspace_fragment>
}`;

function makeMaterial(tex, ref, shadow){
  return new THREE.ShaderMaterial({
    uniforms: {
      map:      { value: tex.photo },
      maskMap:  { value: tex.mask },
      depthMap: { value: tex.depth },
      uCut:     { value: 0 },
      uThresh:  { value: settings.thresh },
      uDepthCut:{ value: settings.depthCut },
      uRef:     { value: ref },
      uOpacity: { value: 1 },
      uShadow:  { value: shadow ? 1 : 0 },
    },
    vertexShader: VERT,
    fragmentShader: FRAG,
    transparent: true,
    depthWrite: !shadow,
    side: shadow ? THREE.BackSide : THREE.FrontSide,
  });
}

function setCut(mesh, on){
  mesh.userData.cut = on;
  mesh.material.uniforms.uCut.value = on ? 1 : 0;
  mesh.userData.back.material.uniforms.uCut.value = on ? 1 : 0;
}

// 奥行き（飛び出し量・凹凸・なめらかさ）を形に反映
function applyGeometry(mesh){
  const u = mesh.userData;
  if (u.smoothR !== settings.smooth){
    u.P = smoothDepth(u.G, u.M, u.gw, u.gh, settings.smooth);
    u.smoothR = settings.smooth;
  }
  const { P, gw, gh, ref } = u;
  const geo = mesh.geometry, pos = geo.attributes.position, uv = geo.attributes.uv;
  const scale = settings.depth, relief = settings.relief;
  for (let i = 0; i < pos.count; i++){
    const fx = uv.getX(i) * (gw-1), fy = (1 - uv.getY(i)) * (gh-1);
    const x0 = Math.floor(fx), y0 = Math.floor(fy);
    const x1 = Math.min(x0+1, gw-1), y1 = Math.min(y0+1, gh-1);
    const ax = fx - x0, ay = fy - y0;
    const d = P[y0*gw+x0]*(1-ax)*(1-ay) + P[y0*gw+x1]*ax*(1-ay) + P[y1*gw+x0]*(1-ax)*ay + P[y1*gw+x1]*ax*ay;
    // 全体は ref の位置まで飛び出し、その周りの凹凸だけ relief 倍にする
    pos.setZ(i, scale * (ref + (d - ref) * relief));
  }
  pos.needsUpdate = true;
  geo.computeBoundingBox();
  geo.computeBoundingSphere();
}

// しきい値・後ろを削る・裏側 を反映
function applyLook(){
  for (const m of photos){
    for (const mat of [m.material, m.userData.back.material]){
      mat.uniforms.uThresh.value = settings.thresh;
      mat.uniforms.uDepthCut.value = settings.depthCut;
    }
    m.material.side = settings.back === 'show' ? THREE.DoubleSide : THREE.FrontSide;
    m.userData.back.visible = settings.back === 'shadow';
  }
}

async function makePopPhoto(file, index, label){
  const url = URL.createObjectURL(file);
  const img = await loadImage(url);
  await loadDepthModel();

  status.textContent = `${label}：奥行きを推定中…`;
  const depthRaw = (await depthModel(url)).depth;
  status.textContent = `${label}：人物を切り抜き中…`;
  const maskRaw = await runCutout(file, url);

  const aspect = img.width / img.height;
  const [gw, gh] = fitSize(img.width, img.height, GRID);
  const depthCanvas = depthRaw.toCanvas();
  const G = canvasToGrid(depthCanvas, gw, gh);
  const [mw, mh] = fitSize(img.width, img.height, MAX_MASK);
  const maskCanvas = rawToCanvas(maskRaw, mw, mh);
  const M = canvasToGrid(maskCanvas, gw, gh);
  const ref = medianMasked(G, M);

  // 奥行きテクスチャ（「人物の後ろを削る」用）
  const dd = new Uint8Array(gw*gh*4);
  for (let y = 0; y < gh; y++) for (let x = 0; x < gw; x++){
    const v = Math.round(G[(gh-1-y)*gw + x] * 255), o = (y*gw + x) * 4;
    dd[o] = dd[o+1] = dd[o+2] = v; dd[o+3] = 255;
  }
  const depthTex = new THREE.DataTexture(dd, gw, gh, THREE.RGBAFormat);
  depthTex.magFilter = depthTex.minFilter = THREE.LinearFilter;
  depthTex.needsUpdate = true;

  const tex = { photo: toTexture(drawPhoto(img)), mask: toTexture(maskCanvas, false), depth: depthTex };

  const h = 0.6, w = h * aspect;
  const segX = aspect >= 1 ? 256 : Math.max(2, Math.round(256*aspect));
  const segY = aspect >= 1 ? Math.max(2, Math.round(256/aspect)) : 256;
  const geo = new THREE.PlaneGeometry(w, h, segX, segY);

  const mesh = new THREE.Mesh(geo, makeMaterial(tex, ref, false));
  const back = new THREE.Mesh(geo, makeMaterial(tex, ref, true));
  back.raycast = () => {};       // 裏の影はつかめないようにする
  mesh.add(back);
  Object.assign(mesh.userData, { back, G, M, gw, gh, ref, smoothR: null });

  applyGeometry(mesh);
  setCut(mesh, $('cutDefault').checked);

  const col = index % 5, row = Math.floor(index / 5);
  mesh.position.set((col-2)*0.8, 1.5 - row*0.8, -1.5);
  scene.add(mesh);
  photos.push(mesh);
  applyLook();
  drawPanel();
  URL.revokeObjectURL(url);
}

$('files').addEventListener('change', async e => {
  const files = [...e.target.files];
  const n = files.length;
  const t0 = performance.now();
  for (let i = 0; i < n; i++){
    let eta = '';
    if (i > 0){
      const per = (performance.now() - t0) / i / 1000;
      eta = `（残り約 ${Math.ceil(per * (n - i))} 秒）`;
    }
    setBar('allBox','allFill','allText', i/n, `全体 ${i} / ${n} 枚 完了 ${eta}`);
    try {
      await makePopPhoto(files[i], photos.length, `${i+1} 枚目`);
    } catch (err) {
      showErr(`${i+1} 枚目（${files[i].name}）で失敗：${err && err.message ? err.message : err}`);
    }
  }
  setBar('allBox','allFill','allText', 1, `全体 ${n} / ${n} 枚 完了`);
  status.textContent = `合計 ${photos.length} 枚 準備完了。START AR を押してください。`;
  e.target.value = '';
});

let allCut = $('cutDefault').checked;
$('cutAllOn').onclick  = () => { allCut = true;  photos.forEach(m => setCut(m, true));  drawPanel(); };
$('cutAllOff').onclick = () => { allCut = false; photos.forEach(m => setCut(m, false)); drawPanel(); };

// =====================================================================
// VRの中の調整パネル
// =====================================================================
const PW = 1024, HEAD = 110, ROWH = 92;
const panelRows = [
  ...PARAMS.map(p => ({ type: p.options ? 'cycle' : 'num', p })),
  { type:'cutall' },
  { type:'clear' },
  { type:'footer' },
];
let clearArmed = 0;   // 「全部消す」の確認待ち（押した時刻）
const PH = HEAD + panelRows.length * ROWH + 24;
const pc = document.createElement('canvas'); pc.width = PW; pc.height = PH;
const ptex = new THREE.CanvasTexture(pc); ptex.colorSpace = THREE.SRGBColorSpace;
const PANEL_W = 0.62;
const panel = new THREE.Mesh(
  new THREE.PlaneGeometry(PANEL_W, PANEL_W * PH / PW),
  new THREE.MeshBasicMaterial({ map: ptex, transparent: true, depthTest: false })
);
panel.renderOrder = 999;
panel.visible = false;
scene.add(panel);

function rowButtons(r, i){
  const y = HEAD + i*ROWH, y0 = y + 12, y1 = y + ROWH - 12;
  if (r.type === 'num') return [
    { x0:660, x1:810, y0, y1, text:'−', act:() => setParam(r.p.key, settings[r.p.key] - r.p.step) },
    { x0:850, x1:1000, y0, y1, text:'+', act:() => setParam(r.p.key, settings[r.p.key] + r.p.step) },
  ];
  if (r.type === 'cycle') return [
    { x0:660, x1:1000, y0, y1, text: r.p.names[settings[r.p.key]], act:() => {
      const o = r.p.options; setParam(r.p.key, o[(o.indexOf(settings[r.p.key]) + 1) % o.length]);
    }},
  ];
  if (r.type === 'cutall') return [
    { x0:660, x1:1000, y0, y1, text: allCut ? 'ON' : 'OFF', act:() => {
      allCut = !allCut; photos.forEach(m => setCut(m, allCut)); drawPanel();
    }},
  ];
  if (r.type === 'clear'){
    const armed = performance.now() - clearArmed < 3000;
    return [
      { x0:660, x1:1000, y0, y1, text: armed ? 'もう一度で消去' : '全部消す', danger:true, act:() => {
        if (performance.now() - clearArmed < 3000){ clearArmed = 0; removeAllPhotos(); }
        else { clearArmed = performance.now(); setTimeout(drawPanel, 3100); }
        drawPanel();
      }},
    ];
  }
  return [
    { x0:30,  x1:500,  y0, y1, text:'初期値に戻す', act:() => resetParams() },
    { x0:530, x1:1000, y0, y1, text:'閉じる', act:() => { panel.visible = false; } },
  ];
}

function rr(g, x, y, w, h, r){
  g.beginPath();
  g.moveTo(x+r, y); g.arcTo(x+w, y, x+w, y+h, r); g.arcTo(x+w, y+h, x, y+h, r);
  g.arcTo(x, y+h, x, y, r); g.arcTo(x, y, x+w, y, r); g.closePath();
}

function drawPanel(){
  const g = pc.getContext('2d');
  g.clearRect(0, 0, PW, PH);
  g.fillStyle = 'rgba(18,22,30,0.92)'; rr(g, 0, 0, PW, PH, 40); g.fill();
  g.textBaseline = 'middle';
  g.fillStyle = '#fff'; g.font = 'bold 50px sans-serif'; g.textAlign = 'left';
  g.fillText('見え方の調整', 36, HEAD/2 + 4);
  g.fillStyle = '#8ab'; g.font = '28px sans-serif'; g.textAlign = 'right';
  g.fillText('トリガーで押す・スティック押し込みで閉じる', PW - 32, HEAD/2 + 4);

  panelRows.forEach((r, i) => {
    const cy = HEAD + i*ROWH + ROWH/2;
    g.textAlign = 'left'; g.fillStyle = '#eee'; g.font = '38px sans-serif';
    if (r.type === 'num' || r.type === 'cycle') g.fillText(r.p.label, 36, cy);
    if (r.type === 'cutall') g.fillText('切り抜き（全部）', 36, cy);
    if (r.type === 'clear') g.fillText(`写真（${photos.length} 枚）`, 36, cy);
    if (r.type === 'num'){
      g.textAlign = 'right'; g.fillStyle = '#7cf'; g.font = 'bold 40px sans-serif';
      g.fillText(r.p.fmt(settings[r.p.key]), 640, cy);
    }
    for (const b of rowButtons(r, i)){
      g.fillStyle = b.danger ? '#7a2630' : '#2d3a4f'; rr(g, b.x0, b.y0, b.x1-b.x0, b.y1-b.y0, 18); g.fill();
      g.fillStyle = '#fff'; g.textAlign = 'center';
      g.font = (b.text === '+' || b.text === '−') ? 'bold 56px sans-serif' : 'bold 36px sans-serif';
      g.fillText(b.text, (b.x0+b.x1)/2, (b.y0+b.y1)/2 + 2);
    }
  });
  ptex.needsUpdate = true;
}

const tmpP = new THREE.Vector3(), tmpDir = new THREE.Vector3();
function togglePanel(){
  if (panel.visible){ panel.visible = false; return; }
  camera.getWorldPosition(tmpP);
  camera.getWorldDirection(tmpDir);
  tmpDir.y = 0;
  if (tmpDir.lengthSq() < 1e-4) tmpDir.set(0, 0, -1);
  tmpDir.normalize();
  panel.position.copy(tmpP).addScaledVector(tmpDir, 0.65);
  panel.position.y = tmpP.y - 0.12;
  panel.lookAt(tmpP.x, panel.position.y, tmpP.z);
  drawPanel();
  panel.visible = true;
}

function clickPanel(hit){
  const px = hit.uv.x * PW, py = (1 - hit.uv.y) * PH;
  panelRows.forEach((r, i) => {
    for (const b of rowButtons(r, i)){
      if (px >= b.x0 && px <= b.x1 && py >= b.y0 && py <= b.y1) b.act();
    }
  });
}

// =====================================================================
// コントローラー操作
// =====================================================================
const raycaster = new THREE.Raycaster();
const tmpA = new THREE.Vector3(), tmpB = new THREE.Vector3();
let twoHand = null;

function handDistance(){
  controllers[0].getWorldPosition(tmpA);
  controllers[1].getWorldPosition(tmpB);
  return tmpA.distanceTo(tmpB);
}
function setRay(c){
  const m = new THREE.Matrix4().extractRotation(c.matrixWorld);
  raycaster.ray.origin.setFromMatrixPosition(c.matrixWorld);
  raycaster.ray.direction.set(0,0,-1).applyMatrix4(m);
}

const controllers = [0,1].map(i => {
  const c = renderer.xr.getController(i);
  const lineMat = new THREE.LineBasicMaterial({ color:0x00ffff });
  const line = new THREE.Line(
    new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), new THREE.Vector3(0,0,-1)]), lineMat);
  line.scale.z = 3;
  c.add(line);
  c.userData.lineMat = lineMat;
  c.userData.prevBtn = {};
  c.addEventListener('connected', e => c.userData.gamepad = e.data.gamepad);

  c.addEventListener('selectstart', () => {
    setRay(c);
    if (panel.visible){
      const ph = raycaster.intersectObject(panel, false)[0];
      if (ph){ clickPanel(ph); return; }
    }
    const hit = raycaster.intersectObjects(photos, false)[0];
    if (!hit) return;
    const other = controllers[1 - i];
    if (other.userData.held === hit.object){
      twoHand = { obj: hit.object, d0: handDistance(), s0: hit.object.scale.x };
      c.userData.scaler = true;
      c.userData.lineMat.color.set(0xffcc00);
      other.userData.lineMat.color.set(0xffcc00);
    } else {
      c.attach(hit.object);
      c.userData.held = hit.object;
    }
  });

  c.addEventListener('selectend', () => {
    const other = controllers[1 - i];
    if (c.userData.scaler){
      c.userData.scaler = false;
      twoHand = null;
    }
    if (c.userData.held){
      scene.attach(c.userData.held);
      c.userData.held = null;
      twoHand = null;
      other.userData.scaler = false;
    }
    c.userData.lineMat.color.set(0x00ffff);
    other.userData.lineMat.color.set(0x00ffff);
  });

  scene.add(c);
  return c;
});

// ===== 写真の削除 =====
function disposePhoto(m){
  m.parent && m.parent.remove(m);
  const mats = [m.material, m.userData.back.material];
  const texs = new Set();
  for (const mat of mats){
    for (const k of ['map','maskMap','depthMap']) texs.add(mat.uniforms[k].value);
    mat.dispose();
  }
  texs.forEach(t => t && t.dispose());
  m.geometry.dispose();
  const i = photos.indexOf(m);
  if (i >= 0) photos.splice(i, 1);
}
function releaseAll(){
  twoHand = null;
  for (const c of controllers){
    c.userData.held = null;
    c.userData.scaler = false;
    c.userData.lineMat.color.set(0x00ffff);
  }
}
function deleteHeld(c){
  const m = c.userData.held;
  if (!m) return;
  for (const o of controllers) if (o.userData.held === m) o.userData.held = null;
  if (twoHand && twoHand.obj === m) releaseAll();
  c.userData.lineMat.color.set(0x00ffff);
  disposePhoto(m);
  drawPanel();
}
function removeAllPhotos(){
  releaseAll();
  [...photos].forEach(disposePhoto);
  status.textContent = '写真を全部消しました。';
  drawPanel();
}

function pressed(c, idx){
  const gp = c.userData.gamepad;
  const now = !!(gp && gp.buttons[idx] && gp.buttons[idx].pressed);
  const was = !!c.userData.prevBtn[idx];
  c.userData.prevBtn[idx] = now;
  return now && !was;
}

// 斜めから見たときに薄くする
const camPos = new THREE.Vector3(), wq = new THREE.Quaternion(), wn = new THREE.Vector3(),
      wp = new THREE.Vector3(), toCam = new THREE.Vector3();
const smooth01 = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t*t*(3 - 2*t); };
const fadeAt = ang => settings.fade >= 90 ? 1 : 1 - smooth01(settings.fade, settings.fade + 20, ang);

function updateFade(){
  camera.getWorldPosition(camPos);
  for (const m of photos){
    m.getWorldPosition(wp);
    m.getWorldQuaternion(wq);
    wn.set(0, 0, 1).applyQuaternion(wq);
    toCam.subVectors(camPos, wp).normalize();
    const ang = THREE.MathUtils.radToDeg(Math.acos(Math.min(1, Math.max(-1, wn.dot(toCam)))));
    const front = settings.back === 'show' ? fadeAt(Math.min(ang, 180 - ang)) : fadeAt(ang);
    m.material.uniforms.uOpacity.value = front;
    m.userData.back.material.uniforms.uOpacity.value = fadeAt(180 - ang);
  }
}

renderer.setAnimationLoop(() => {
  for (const c of controllers){
    if (pressed(c, 3)){
      if (c.userData.held) deleteHeld(c);   // つかんでいれば その写真を削除
      else togglePanel();                   // つかんでいなければ 調整パネル
    }
    if (pressed(c, 4) && c.userData.held){
      const m = c.userData.held;
      setCut(m, !m.userData.cut);
    }
    if (pressed(c, 5)){
      allCut = !allCut;
      photos.forEach(m => setCut(m, allCut));
      drawPanel();
    }
  }

  if (geoDirty){
    geoDirty = false;
    photos.forEach(applyGeometry);
  }

  if (twoHand){
    const s = twoHand.s0 * handDistance() / twoHand.d0;
    twoHand.obj.scale.setScalar(Math.min(20, Math.max(0.05, s)));
  } else {
    for (const c of controllers){
      const obj = c.userData.held, gp = c.userData.gamepad;
      if (obj && gp && gp.axes.length >= 4){
        obj.scale.multiplyScalar(1 - gp.axes[3] * 0.02);
      }
    }
  }
  updateFade();
  renderer.render(scene, camera);
});

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

syncHtml();
drawPanel();
</script>
